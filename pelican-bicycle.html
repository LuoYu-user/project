<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(#aee3f7 0%, #d9f0fb 70%, #f7e9c4 70%, #f0dca0 100%);
    overflow: hidden;
    font-family: sans-serif;
  }
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  h1 {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    color: #2b5d78;
    letter-spacing: 4px;
    font-size: clamp(16px, 3vw, 28px);
    text-shadow: 1px 1px 0 #fff;
  }
</style>
</head>
<body>
<div class="scene">
<h1>🚲 鹈鹕骑行中 🚲</h1>
<svg viewBox="0 0 900 500" preserveAspectRatio="xMidYMax meet" aria-label="一只鹈鹕骑着自行车前进的动画">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6b0"/>
      <stop offset="100%" stop-color="#ffd54a"/>
    </radialGradient>
  </defs>

  <!-- 太阳 -->
  <circle cx="780" cy="80" r="42" fill="url(#sun)"/>

  <!-- 远处的云 -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="160" cy="90" rx="46" ry="18"/>
    <ellipse cx="200" cy="78"  rx="34" ry="16"/>
    <ellipse cx="470" cy="60" rx="38" ry="15"/>
    <ellipse cx="505" cy="72" rx="28" ry="12"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="420" width="900" height="80" fill="#e8c97a"/>
  <rect x="0" y="420" width="900" height="8" fill="#d4b168"/>

  <!-- 鹈鹕 + 自行车编组：整体上下颠簸 -->
  <g id="rider">
    <!-- 阴影 -->
    <ellipse cx="450" cy="452" rx="130" ry="10" fill="#000" opacity="0.15"/>

    <!-- ================= 自行车 ================= -->
    <!-- 后轮 -->
    <g>
      <circle cx="340" cy="390" r="52" fill="none" stroke="#333" stroke-width="7"/>
      <circle cx="340" cy="390" r="6" fill="#555"/>
      <g stroke="#888" stroke-width="2.5">
        <line x1="340" y1="338" x2="340" y2="442"/>
        <line x1="288" y1="390" x2="392" y2="390"/>
        <line x1="303" y1="353" x2="377" y2="427"/>
        <line x1="303" y1="427" x2="377" y2="353"/>
        <line x1="290" y1="372" x2="390" y2="408"/>
        <line x1="290" y1="408" x2="390" y2="372"/>
      </g>
      <circle cx="340" cy="390" r="52" fill="none" stroke="#222" stroke-width="3"/>
    </g>
    <!-- 前轮 -->
    <g>
      <circle cx="560" cy="390" r="52" fill="none" stroke="#333" stroke-width="7"/>
      <circle cx="560" cy="390" r="6" fill="#555"/>
      <g stroke="#888" stroke-width="2.5">
        <line x1="560" y1="338" x2="560" y2="442"/>
        <line x1="508" y1="390" x2="612" y2="390"/>
        <line x1="523" y1="353" x2="597" y2="427"/>
        <line x1="523" y1="427" x2="597" y2="353"/>
        <line x1="510" y1="372" x2="610" y2="408"/>
        <line x1="510" y1="408" x2="610" y2="372"/>
      </g>
      <circle cx="560" cy="390" r="52" fill="none" stroke="#222" stroke-width="3"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e0552b" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M340 390 L440 300 L560 390"/>          <!-- 主三角 -->
      <path d="M440 300 L475 390"/>                     <!-- 座管到后轮 -->
      <path d="M440 300 L560 390"/>                     <!-- 上管到前叉 -->
      <path d="M560 390 L575 292"/>                     <!-- 前叉到车把 -->
    </g>
    <!-- 车座 -->
    <path d="M418 292 q26 -10 46 2 q-24 10 -46 -2z" fill="#3b2a1f"/>
    <!-- 车把 -->
    <path d="M575 292 q22 -8 30 -26" stroke="#333" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- 脚踏曲柄与踏板（旋转） -->
    <g id="crank">
      <line x1="475" y1="390" x2="505" y2="350" stroke="#444" stroke-width="6" stroke-linecap="round"/>
      <line x1="475" y1="390" x2="445" y2="430" stroke="#444" stroke-width="6" stroke-linecap="round"/>
      <rect x="497" y="344" width="18" height="6" rx="2" fill="#222"/>
      <rect x="437" y="427" width="18" height="6" rx="2" fill="#222"/>
      <circle cx="475" cy="390" r="8" fill="#666"/>
    </g>

    <!-- ================= 鹈鹕 ================= -->
    <!-- 后腿（连接后方踏板, 跟随曲柄动画近似） -->
    <path id="legBack" d="M410 288 q-30 60 35 140"
          stroke="#e8a13c" stroke-width="13" fill="none" stroke-linecap="round"/>

    <!-- 尾羽 -->
    <path d="M330 250 q-60 10 -75 55 q50 15 95 -10 q-15 -30 -20 -45z" fill="#f5f0e6" stroke="#d8cdb8" stroke-width="3"/>

    <!-- 身体 -->
    <path d="M340 255
             q-25 55 5 100
             q35 35 95 20
             q55 -20 60 -75
             q5 -55 -45 -70
             q-70 -15 -115 25z"
          fill="#fdfaf2" stroke="#d8cdb8" stroke-width="3"/>

    <!-- 翅膀（拍动） -->
    <g id="wing" style="transform-origin:395px 265px;">
      <path d="M395 265 q-70 25 -60 85 q45 -10 75 -50 q-8 -25 -15 -35z"
            fill="#f2e8d5" stroke="#d8cdb8" stroke-width="3"/>
    </g>

    <!-- 前腿（连接前方踏板） -->
    <path id="legFront" d="M420 285 q20 65 60 115"
          stroke="#f5b642" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- 脖子 -->
    <path d="M470 205 q60 -20 55 -85 q-3 -38 -40 -42"
          fill="none" stroke="#fdfaf2" stroke-width="34" stroke-linecap="round"/>

    <!-- 头 -->
    <g id="head">
      <circle cx="483" cy="80" r="34" fill="#fdfaf2" stroke="#d8cdb8" stroke-width="3"/>
      <!-- 眼睛 -->
      <circle cx="472" cy="68" r="6.5" fill="#2b2b2b"/>
      <circle cx="474.5" cy="65.5" r="2.2" fill="#fff"/>
      <!-- 鹈鹕大嘴：轻微张合 -->
      <g id="beak">
        <!-- 上喙 -->
        <path d="M505 70 q95 14 130 34 q-95 8 -135 -12z"
              fill="#f7b32b" stroke="#d99414" stroke-width="3"/>
        <!-- 下喙 + 喉囊 -->
        <path d="M505 88 q80 26 118 34 q-90 22 -122 -12z"
              fill="#f49c2c" stroke="#d99414" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
</div>

<script>
  const SVG_NS = "http://www.w3.org/2000/svg";
  const svg = document.querySelector("svg");
  const crank = document.getElementById("crank");
  const legFront = document.getElementById("legFront");
  const legBack = document.getElementById("legBack");
  const wing = document.getElementById("wing");
  const head = document.getElementById("head");
  const rider = document.getElementById("rider");

  // 曲柄中心（前牙盘位置）
  const CX = 475, CY = 390, CR = 45;
  // 腿根部（髋关节，位于身体上）
  const HIPX = 415, HIPY = 282;

  function angleOnCrank(theta) {
    // 前踏板（曲柄前方）与后踏板相位差 180°
    return {
      front: [CX + CR * Math.cos(theta),     CY + CR * Math.sin(theta)],
      back:  [CX + CR * Math.cos(theta + Math.PI), CY + CR * Math.sin(theta + Math.PI)]
    };
  }

  // 简单两点式 IK：膝盖在髋与踏板之间向上拱起
  function legPath(hx, hy, fx, fy, bend) {
    const mx = (hx + fx) / 2, my = (hy + fy) / 2;
    const dx = fx - hx, dy = fy - hy;
    const len = Math.hypot(dx, dy) || 1;
    // 垂直于髋->踏连线方向偏移，形成膝盖
    const kx = mx + (-dy / len) * bend;
    const ky = my + (dx / len) * bend;
    return `M${hx} ${hy} Q${kx} ${ky} ${fx} ${fy}`;
  }

  let t0 = performance.now();
  const RPS = 1.05;              // 曲柄转速（圈/秒）
  const WING_S = 2.2;            // 翅膀拍动频率

  function frame(now) {
    const t = (now - t0) / 1000;
    const theta = t * RPS * 2 * Math.PI - Math.PI / 2;

    // 曲柄旋转
    crank.setAttribute("transform", `rotate(${(theta * 180 / Math.PI) + 90} ${CX} ${CY})`);

    // 踏板位置（旋转后世界坐标）
    const pts = angleOnCrank(theta);
    legFront.setAttribute("d", legPath(HIPX, HIPY, pts.front[0], pts.front[1] - 6, 30));
    legBack.setAttribute("d",  legPath(HIPX - 8, HIPY + 4, pts.back[0], pts.back[1] - 6, 34));

    // 翅膀拍动
    const wa = Math.sin(t * WING_S * 2 * Math.PI) * 9;
    wing.style.transform = `rotate(${wa}deg)`;

    // 头部轻微随节奏点动
    const hb = Math.sin(t * RPS * 2 * Math.PI * 2) * 2;
    head.setAttribute("transform", `translate(0 ${hb})`);

    // 嘴巴周期性张合
    const open = (Math.sin(t * 1.6) > 0.92) ? 6 : 0;
    document.getElementById("beak").setAttribute("transform", `rotate(${open} 505 82)`);

    // 整体骑行颠簸
    rider.setAttribute("transform", `translate(0 ${Math.sin(t * RPS * 2 * Math.PI) * 3 - 1.5})`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
